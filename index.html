<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NASA // SIBLING_LINK</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.js"></script>
    <style>
        :root { --nasa-red: #fc3d21; --nasa-blue: #0b3d91; --terminal-green: #00ff41; --analog-grey: #c0c0c0; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #000; color: var(--terminal-green); font-family: 'Courier New', monospace; margin: 0; padding: 10px; }
        
        /* CRT overlay - pointer-events: none is critical! */
        .crt { position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
               background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%); 
               background-size: 100% 4px; z-index: 10; pointer-events: none; opacity: 0.2; }

        .terminal { width: 100%; max-width: 450px; border: 4px solid var(--analog-grey); 
                    background: #111; padding: 15px; margin: auto; position: relative; z-index: 1; }
        
        .header { text-align: center; border-bottom: 2px solid var(--nasa-red); margin-bottom: 20px; }
        
        .nav-deck { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        
        /* Tactical Buttons */
        button { background: var(--analog-grey); color: #000; border: 3px outset #fff; 
                 padding: 12px; font-weight: bold; cursor: pointer; font-family: inherit; font-size: 0.8rem; }
        button:active { border-style: inset; background: #999; }

        input, select { width: 100%; background: #000; color: var(--terminal-green); 
                        border: 1px solid var(--terminal-green); padding: 10px; margin: 8px 0; }

        .hidden { display: none !important; }
        .poster-frame { width: 160px; height: 230px; border: 3px double var(--terminal-green); margin: 15px auto; background-size: cover; }
    </style>
</head>
<body>

<div class="crt"></div>

<div class="terminal">
    <div class="header">
        <h1>NASA // MISSION_CONTROL</h1>
        <p style="font-size: 0.6rem; color: var(--nasa-red);">LINK_STATUS: ONLINE</p>
    </div>

    <div id="pg-theater">
        <div id="theater-content">
            <p style="text-align: center;">> SCANNING SATELLITE FEED...</p>
        </div>
    </div>

    <div id="pg-upload" class="hidden">
        <h2 style="font-size: 0.8rem;">> UPLOAD_TAPE_MODULE</h2>
        <input type="text" id="m-title" placeholder="FILM_TITLE">
        <select id="m-picker">
            <option>SIBLING 1</option><option>SIBLING 2</option>
            <option>SIBLING 3</option><option>SIBLING 4</option>
        </select>
        <p style="font-size: 0.6rem;">[SELECT_IMAGE_FILE]</p>
        <input type="file" id="m-img" accept="image/*">
        <button onclick="uploadMovie()" style="width: 100%; background: var(--nasa-red); color: white;">LOCK_IN</button>
    </div>

    <div class="nav-deck">
        <button onclick="go('pg-theater')">VIEW<br>COMMMS</button>
        <button onclick="go('pg-upload')">LOAD<br>DATA</button>
    </div>
</div>

<script>
    // 1. HARD-CODED SUPABASE CONNECTION
    const SB_URL = "https://vzwcarzsrbgrjrqoflbh.supabase.co";
    const SB_KEY = "sb_publishable_KY4Pldcx5bnPKuOgLWg3wA_7IiGzChd";
    
    // Check if library loaded, then init
    let supabase;
    try {
        supabase = window.supabase.createClient(SB_URL, SB_KEY);
        console.log("Supabase Online");
    } catch (e) {
        alert("CRITICAL ERROR: Supabase Library Not Loaded");
    }

    // 2. DIRECT NAVIGATION (No fancy logic, just show/hide)
    function go(pageId) {
        console.log("Switching to:", pageId);
        
        // Hide all
        document.getElementById('pg-theater').classList.add('hidden');
        document.getElementById('pg-upload').classList.add('hidden');
        
        // Show target
        document.getElementById(pageId).classList.remove('hidden');

        if(pageId === 'pg-theater') refresh();
    }

    // 3. REFRESH DATA
    async function refresh() {
        const target = document.getElementById('theater-content');
        
        const { data: movies } = await supabase.from('movies').select('*');
        const active = movies.find(m => m.status === 'selected');

        if (active) {
            target.innerHTML = `
                <div class="poster-frame" style="background-image:url(${active.poster_url})"></div>
                <h3 style="text-align:center">${active.title}</h3>
                <p style="text-align:center; font-size:0.7rem">PICKED BY: ${active.picker}</p>
                <div style="background:#222; padding:10px; border:1px solid var(--terminal-green);">
                    <p style="font-size:0.6rem">LOG RATING (1-5):</p>
                    <input type="number" id="stars" min="1" max="5" value="5">
                    <button onclick="rate('${active.id}')" style="width:100%">LOG_DATA</button>
                </div>
                <button onclick="clearSystem()" style="width:100%; margin-top:10px; background:#444; color:white;">EJECT_WEEKLY_TAPE</button>
            `;
        } else {
            const pending = movies.filter(m => m.status === 'pending');
            target.innerHTML = `
                <p style="text-align:center">> UPLOADS_DETECTED: ${pending.length}/4</p>
                <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:5px; margin:15px 0;">
                    ${[0,1,2,3].map(i => `<div style="height:40px; border:2px dashed #333; background:${pending[i] ? 'var(--terminal-green)' : 'transparent'}"></div>`).join('')}
                </div>
                ${pending.length >= 4 ? `<button onclick="spin()" style="width:100%; background:var(--nasa-blue); color:white">INITIATE_RANDOM_SELECTION</button>` : ''}
            `;
        }
    }

    // 4. ACTION FUNCTIONS
    async function uploadMovie() {
        const title = document.getElementById('m-title').value;
        const picker = document.getElementById('m-picker').value;
        const file = document.getElementById('m-img').files[0];

        if(!title || !file) return alert("INPUT ERROR");

        const path = `posters/${Date.now()}.png`;
        const { data, error } = await supabase.storage.from('posters').upload(path, file);
        
        if(error) return alert("UPLOAD FAILED: " + error.message);

        const url = `${SB_URL}/storage/v1/object/public/posters/${path}`;
        await supabase.from('movies').insert([{ title, picker, poster_url: url, status: 'pending' }]);
        
        alert("TRANSMISSION SUCCESS");
        go('pg-theater');
    }

    async function spin() {
        const { data } = await supabase.from('movies').select('*').eq('status', 'pending');
        const winner = data[Math.floor(Math.random() * data.length)];
        await supabase.from('movies').update({ status: 'selected' }).eq('id', winner.id);
        refresh();
    }

    async function rate(mid) {
        const s = document.getElementById('stars').value;
        await supabase.from('ratings').insert([{ movie_id: mid, stars: s }]);
        alert("RATING LOGGED");
    }

    async function clearSystem() {
        if(confirm("CONFIRM DATA PURGE?")) {
            await supabase.from('movies').delete().neq('id', '00000000-0000-0000-0000-000000000000');
            refresh();
        }
    }

    // INITIAL BOOT
    refresh();
</script>
</body>
</html>
