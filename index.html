<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NSFW // SYSTEM_V6</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --neon-pink: #ff00ff; --neon-cyan: #00ffff;
            --vhs-beige: #d8cfbc; --tape-black: #121212;
        }

        /* 1. RESET LAYER STACK */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: #000; color: var(--neon-cyan);
            font-family: 'Courier New', monospace; margin: 0; padding: 0;
            display: flex; flex-direction: column; height: 100vh;
        }

        /* 2. THE SCANLINE (POINTER-EVENTS: NONE IS VITAL) */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 3px; z-index: 9999; pointer-events: none;
        }

        /* 3. MAIN CONSOLE BOX */
        .console-outer {
            flex: 1; margin: 10px; border: 8px solid var(--vhs-beige);
            background: #1a1a1a; display: flex; flex-direction: column;
            overflow-y: auto; padding: 10px; border-radius: 4px;
            box-shadow: inset 0 0 50px #000; z-index: 10;
        }

        /* 4. VCR NAVIGATION (DOCK TO BOTTOM) */
        .vcr-controls {
            display: flex; background: #222; border-top: 5px solid var(--vhs-beige);
            padding: 10px; gap: 10px; z-index: 100;
        }

        .vcr-btn {
            flex: 1; height: 60px; background: #333; border: 4px outset #555;
            color: var(--vhs-beige); font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            text-align: center; font-size: 0.7rem; position: relative;
        }

        .vcr-btn:active { border-style: inset; background: #222; }
        .vcr-btn.active { border-color: var(--neon-cyan); box-shadow: 0 0 10px var(--neon-cyan); }
        .vcr-btn.active::before { 
            content: "●"; position: absolute; top: 5px; right: 5px; color: var(--neon-pink); font-size: 8px;
        }

        /* 5. THEATER & FORMS */
        .content-area { padding-bottom: 20px; }
        .btn-action {
            background: var(--neon-pink); color: white; border: none;
            padding: 15px; width: 100%; font-weight: bold; cursor: pointer;
            margin: 10px 0; font-family: 'Courier New';
        }

        .poster-box {
            width: 140px; height: 200px; border: 2px solid var(--neon-cyan);
            margin: 10px auto; background-size: cover; background-position: center;
        }

        input, select {
            width: 100%; background: #000; color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan); padding: 12px; margin: 8px 0;
            font-family: 'Courier New';
        }

        .hidden { display: none !important; }
        
        video { width: 100%; border: 1px solid var(--neon-pink); }
    </style>
</head>
<body>

<div class="scanlines"></div>

<div class="console-outer">
    <div class="content-area">
        
        <div id="view-theater">
            <h1 style="color:var(--neon-pink); font-size: 1rem; text-align:center;">● PLAY_THEATER</h1>
            <div id="theater-target">Loading System...</div>
        </div>

        <div id="view-upload" class="hidden">
            <h1 style="color:var(--neon-pink); font-size: 1rem; text-align:center;">● REC_MODE</h1>
            <input type="text" id="up-title" placeholder="FILM_TITLE">
            <input type="text" id="up-name" placeholder="YOUR_NAME">
            <p style="font-size:0.7rem">POSTER IMAGE:</p>
            <input type="file" id="up-img" accept="image/*">
            <p style="font-size:0.7rem">INTRO VIDEO:</p>
            <input type="file" id="up-vid" accept="video/*">
            <button class="btn-action" onclick="uploadMovie()">START RECORDING</button>
        </div>

        <div id="view-vault" class="hidden">
            <h1 style="color:var(--neon-pink); font-size: 1rem; text-align:center;">● SEARCH_VAULT</h1>
            <div id="vault-target" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;"></div>
            <div id="dossier-target"></div>
        </div>

    </div>
</div>

<div class="vcr-controls">
    <div id="btn-theater" class="vcr-btn active" onclick="nav('view-theater')">THEATER<br>[PLAY]</div>
    <div id="btn-upload" class="vcr-btn" onclick="nav('view-upload')">UPLOAD<br>[REC]</div>
    <div id="btn-vault" class="vcr-btn" onclick="nav('view-vault')">VAULT<br>[SEARCH]</div>
</div>

<script>
    const SB_URL = "https://vzwcarzsrbgrjrqoflbh.supabase.co";
    const SB_KEY = "sb_publishable_KY4Pldcx5bnPKuOgLWg3wA_7IiGzChd";
    const supabase = libsupabase.createClient(SB_URL, SB_KEY);

    // NAVIGATION LOGIC
    function nav(id) {
        // Toggle Hidden
        document.getElementById('view-theater').classList.add('hidden');
        document.getElementById('view-upload').classList.add('hidden');
        document.getElementById('view-vault').classList.add('hidden');
        document.getElementById(id).classList.remove('hidden');

        // Toggle Active Button
        document.querySelectorAll('.vcr-btn').forEach(b => b.classList.remove('active'));
        const btnId = 'btn-' + id.split('-')[1];
        document.getElementById(btnId).classList.add('active');

        if(id === 'view-theater') refreshTheater();
        if(id === 'view-vault') loadVault();
    }

    // THEATER LOGIC
    async function refreshTheater() {
        const { data: active } = await supabase.from('movies').select('*').eq('status', 'showing').single();
        const target = document.getElementById('theater-target');

        if (active) {
            target.innerHTML = `
                <div class="poster-box" style="background-image:url(${active.poster_url})"></div>
                <h2 style="text-align:center">${active.title}</h2>
                <video src="${active.intro_url}" controls></video>
                <div style="background:#111; padding:10px; border:1px solid #444; margin-top:15px;">
                    <p style="font-size:0.6rem">SUBMIT REACTION:</p>
                    <input type="text" id="r-name" placeholder="NAME">
                    <select id="r-stars"><option value="5">⭐⭐⭐⭐⭐</option><option value="4">⭐⭐⭐⭐</option><option value="3">⭐⭐⭐</option><option value="2">⭐⭐</option><option value="1">⭐</option></select>
                    <input type="file" id="r-vid" accept="video/*">
                    <button class="btn-action" onclick="submitReview('${active.id}')">LOG REVIEW</button>
                </div>
                <button class="btn-action" style="background:#444" onclick="archiveMovie('${active.id}')">EJECT / ARCHIVE</button>
            `;
        } else {
            const { data: queue } = await supabase.from('movies').select('*').eq('status', 'pending');
            target.innerHTML = `
                <p style="text-align:center">TAPES READY: ${queue.length}</p>
                ${queue.map(m => `<div style="background:#222; padding:8px; margin:5px 0; border-left:4px solid var(--neon-pink)">${m.title}</div>`).join('')}
                <button class="btn-action" onclick="spin()">SPIN FOR TAPE</button>
            `;
        }
    }

    async function spin() {
        const { data } = await supabase.from('movies').select('*').eq('status', 'pending');
        if(!data.length) return alert("QUEUE EMPTY");
        const winner = data[Math.floor(Math.random() * data.length)];
        await supabase.from('movies').update({ status: 'showing' }).eq('id', winner.id);
        refreshTheater();
    }

    // STORAGE LOGIC
    async function uploadMovie() {
        const title = document.getElementById('up-title').value;
        const name = document.getElementById('up-name').value;
        const img = document.getElementById('up-img').files[0];
        const vid = document.getElementById('up-vid').files[0];

        if(!title || !img || !vid) return alert("MISSING FIELDS");

        const iPath = `posters/${Date.now()}`;
        const vPath = `intros/${Date.now()}`;
        
        await supabase.storage.from('posters').upload(iPath, img);
        await supabase.storage.from('intros').upload(vPath, vid);

        await supabase.from('movies').insert([{ 
            title, submitter: name, 
            poster_url: `${SB_URL}/storage/v1/object/public/posters/${iPath}`,
            intro_url: `${SB_URL}/storage/v1/object/public/intros/${vPath}` 
        }]);
        nav('view-theater');
    }

    async function submitReview(movieId) {
        const name = document.getElementById('r-name').value;
        const stars = document.getElementById('r-stars').value;
        const vid = document.getElementById('r-vid').files[0];
        
        const path = `reviews/${Date.now()}`;
        await supabase.storage.from('reviews').upload(path, vid);
        
        await supabase.from('reviews').insert([{
            movie_id: movieId, reviewer_name: name, rating: stars,
            video_url: `${SB_URL}/storage/v1/object/public/reviews/${path}`
        }]);
        alert("LOGGED");
        refreshTheater();
    }

    async function archiveMovie(id) {
        await supabase.from('movies').update({ status: 'archived' }).eq('id', id);
        nav('view-vault');
    }

    async function loadVault() {
        const { data } = await supabase.from('movies').select('*').eq('status', 'archived');
        document.getElementById('vault-target').innerHTML = data.map(m => `
            <div onclick="showDossier('${m.id}')" style="background:#222; padding:5px; border:1px solid #444; text-align:center">
                <div style="height:100px; background:url(${m.poster_url}); background-size:cover;"></div>
                <p style="font-size:0.5rem">${m.title}</p>
            </div>
        `).join('');
    }

    async function showDossier(id) {
        const { data: m } = await supabase.from('movies').select('*').eq('id', id).single();
        const { data: r } = await supabase.from('reviews').select('*').eq('movie_id', id);
        document.getElementById('dossier-target').innerHTML = `
            <div style="background:#000; border:1px solid var(--neon-cyan); padding:10px; margin-top:10px;">
                <h3>${m.title}</h3>
                <video src="${m.intro_url}" controls></video>
                <div style="margin-top:10px">${r.map(rev => `
                    <div style="border-top:1px solid #333; padding:5px">
                        <p style="font-size:0.7rem">${rev.reviewer_name} - ${"⭐".repeat(rev.rating)}</p>
                        <video src="${rev.video_url}" controls></video>
                    </div>
                `).join('')}</div>
                <button class="btn-action" onclick="this.parentElement.innerHTML=''">CLOSE</button>
            </div>
        `;
    }

    // Start
    refreshTheater();
</script>
</body>
</html>
